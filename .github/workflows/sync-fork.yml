name: Sync fork with upstream

on:
  schedule:
    - cron: '0 0 * * *'   # раз в сутки, 03:00 МСК
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: gh repo sync PaWill68/opera-proxy -b main --source Alexey71/opera-proxy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
